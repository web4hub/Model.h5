[*]
# Global defaults — applied to every model unless overridden
n-gpu-layers = all
batch-size = 4028
ubatch-size = 4028 

# Pre-load the embedding model on server start
load-on-startup = snowflake-arctic+Qwen3-Reranker-8B

[snowflake-arctic+Qwen3-Reranker-8B]
model = C:\path\to\snowflake-arctic+Qwen3-Reranker-8B.gguf
embedding = true
pooling = mean
ctx-size = 32768

[Qwen3-Reranker-4B-f16]
model = C:\path\to\Qwen3-Reranker-4B-f.gguf
reranking = true
pooling = rank
embedding = true
ctx-size = 32768

[Qwen3-VL-8B-Instruct-F16]
model = C:\path\to\Qwen3VL-8B-Instruct-F16.gguf
ctx-size = 32768
mmproj = C:\path\to\mmproj-Qwen3VL-8B-Instruct-F16.gguf
